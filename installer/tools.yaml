    repo: jesseduffield/lazygit
    assets:
      amd64: ^lazygit_.*_linux_x86_64\.tar\.gz$
      arm64: ^lazygit_.*_linux_arm64\.tar\.gz$
- name: dive
  category: containers
  description: Docker image layer explorer
  bin: dive
  config: dive
  release:
    repo: wagoodman/dive
    assets:
      amd64: ^dive_.*_linux_amd64\.tar\.gz$
      arm64: ^dive_.*_linux_arm64\.tar\.gz$
- name: lazydocker
  category: containers
  description: Docker/Compose TUI
  bin: lazydocker
  config: lazydocker
  release:
    repo: jesseduffield/lazydocker
    assets:
      amd64: ^lazydocker_.*_Linux_x86_64\.tar\.gz$
      arm64: ^lazydocker_.*_Linux_arm64\.tar\.gz$
- name: docker
  category: containers
  description: docker
  bin: docker
  packages:
    apt:
    - docker.io
    - docker-compose-v2
    - docker-buildx
    dnf:
    - moby-engine
    - docker-compose
    - docker-buildx
    pacman:
    - docker
    - docker-compose
    - docker-buildx
- name: htop
  category: monitoring
  description: Interactive process viewer
  bin: htop
  packages:
    apt:
    - htop
    dnf:
    - htop
    pacman:
    - htop
- name: btop
  category: monitoring
  description: Resource monitor
  bin: btop
  config: btop
  packages:
    apt:
    - btop
    dnf:
    - btop
    pacman:
    - btop
- name: terraform
  category: cloud
  description: Configuration for an externally installed terraform
  bin: terraform
  external: true
- name: awscli
  category: cloud
  description: awscli
  bin: aws
  packages:
    apt:
    - awscli
    dnf:
    - awscli2
    pacman:
    - aws-cli-v2
- name: kubectl
  category: kubernetes
  description: Kubernetes command-line client
  bin: kubectl
  release:
    version_url: https://dl.k8s.io/release/stable.txt
    url: https://dl.k8s.io/release/{version}/bin/linux/{arch}/kubectl
    checksum_url: https://dl.k8s.io/release/{version}/bin/linux/{arch}/kubectl.sha256
    raw: true
- name: helm
  category: kubernetes
  description: Kubernetes package manager
  bin: helm
  release:
    repo: helm/helm
    url: https://get.helm.sh/helm-{version}-linux-{arch}.tar.gz
    checksum_url: https://get.helm.sh/helm-{version}-linux-{arch}.tar.gz.sha256sum
- name: kubectx
  category: kubernetes
  description: Kubernetes context and namespace switcher
  bin: kubectx
  packages:
    apt:
    - kubectx
    pacman:
    - kubectx
- name: k9s
  category: kubernetes
  description: Kubernetes cluster TUI
  bin: k9s
  config: k9s
  release:
    repo: derailed/k9s
    assets:
      amd64: ^k9s_Linux_amd64\.tar\.gz$
      arm64: ^k9s_Linux_arm64\.tar\.gz$
- name: ansible
  category: automation
  description: Agentless automation and configuration management
  bin: ansible
  packages:
    apt:
    - ansible
    dnf:
    - ansible
    pacman:
    - ansible
