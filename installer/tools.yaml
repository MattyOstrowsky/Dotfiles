# Catalog: native packages or verified upstream releases; external = config only.
tools:
- name: curl
  category: general
  description: Command-line HTTP client
  bin: curl
  packages:
    apt:
    - curl
    dnf:
    - curl
    pacman:
    - curl
- name: wget
  category: general
  description: Non-interactive network downloader
  bin: wget
  packages:
    apt:
    - wget
    dnf:
    - wget
    pacman:
    - wget
- name: make
  category: general
  description: Build automation utility
  bin: make
  packages:
    apt:
    - make
    dnf:
    - make
    pacman:
    - make
- name: unzip
  category: general
  description: ZIP archive extractor
  bin: unzip
  packages:
    apt:
    - unzip
    dnf:
    - unzip
    pacman:
    - unzip
- name: fzf
  category: general
  description: General-purpose fuzzy finder
  bin: fzf
  packages:
    apt:
    - fzf
    dnf:
    - fzf
    pacman:
    - fzf
- name: ripgrep
  category: general
  description: Fast recursive text search
  bin: rg
  packages:
    apt:
    - ripgrep
    dnf:
    - ripgrep
    pacman:
    - ripgrep
- name: fd-find
  category: general
  description: Fast user-friendly file finder
  bin: fd
  packages:
    apt:
    - fd-find
    dnf:
    - fd-find
    pacman:
    - fd
- name: tree
  category: general
  description: Directory tree viewer
  bin: tree
  packages:
    apt:
    - tree
    dnf:
    - tree
    pacman:
    - tree
- name: tldr
  category: general
  description: Simplified community-driven command help
  bin: tldr
  packages:
    apt:
    - tealdeer
    dnf:
    - tldr
    pacman:
    - tealdeer
- name: bat
  category: general
  description: cat with wings
  bin: bat
  config: bat
  packages:
    apt:
    - bat
    dnf:
    - bat
    pacman:
    - bat
- name: direnv
  category: general
  description: Per-directory environment variables
  bin: direnv
  config: direnv
  packages:
    apt:
    - direnv
    dnf:
    - direnv
    pacman:
    - direnv
- name: glow
  category: general
  description: Markdown renderer for the terminal
  bin: glow
  config: glow
  release:
    repo: charmbracelet/glow
    assets:
      amd64: ^glow_.*_Linux_x86_64\.tar\.gz$
      arm64: ^glow_.*_Linux_arm64\.tar\.gz$
- name: navi
  category: general
  description: Interactive cheatsheet tool
  bin: navi
  config: navi
  release:
    repo: denisidoro/navi
    assets:
      amd64: ^navi-.*-x86_64-unknown-linux-musl\.tar\.gz$
      arm64: ^navi-.*-aarch64-unknown-linux-musl\.tar\.gz$
- name: jq
  category: general
  description: jq
  bin: jq
  packages:
    apt:
    - jq
    dnf:
    - jq
    pacman:
    - jq
- name: zoxide
  category: shell
  description: Smarter directory jumper
  bin: zoxide
  packages:
    apt:
    - zoxide
    pacman:
    - zoxide
- name: fish
  category: shell
  description: Interactive shell
  bin: fish
  config: fish
  packages:
    apt:
    - fish
    dnf:
    - fish
    pacman:
    - fish
- name: starship
  category: shell
  description: Cross-shell prompt
  bin: starship
  config: starship
  release:
    repo: starship/starship
    assets:
      amd64: ^starship-x86_64-unknown-linux-gnu\.tar\.gz$
      arm64: ^starship-aarch64-unknown-linux-gnu\.tar\.gz$
- name: atuin
  category: shell
  description: Shell history search (Ctrl+R replacement)
  bin: atuin
  config: atuin
  release:
    repo: atuinsh/atuin
    assets:
      amd64: ^atuin-x86_64-unknown-linux-gnu\.tar\.gz$
      arm64: ^atuin-aarch64-unknown-linux-gnu\.tar\.gz$
- name: tmux
  category: shell
  description: tmux
  bin: tmux
  packages:
    apt:
    - tmux
    dnf:
    - tmux
    pacman:
    - tmux
  config: tmux
- name: git
  category: git
  description: Distributed version control system
  bin: git
  config: git
  packages:
    apt:
    - git
    dnf:
    - git
    pacman:
    - git
- name: gh
  category: git
  description: GitHub command-line client
  bin: gh
  packages:
    apt:
    - gh
    dnf:
    - gh
    pacman:
    - github-cli
- name: lazygit
