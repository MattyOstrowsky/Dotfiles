providers:
  webSearchOrder:
  - perplexity
  - gemini
  - anthropic
  - codex
  - xai
  - zai
  - exa
  - tinyfish
  - jina
  - kagi
  - tavily
  - firecrawl
  - brave
  - kimi
  - parallel
  - synthetic
  - searxng
  - startpage
  - duckduckgo
  - ecosia
  - google
  - mojeek
  - public
  maxInFlightRequests:
    opencode-go: 3
    openai-codex: 3
setupVersion: 2
theme:
  dark: dark-nord
  light: dark-nord
colorBlindMode: true
statusLine:
  transparent: true
  compactThinkingLevel: false
  showHookStatus: true
  preset: full
  contextLine: percentage
defaultThinkingLevel: auto
memory:
  backend: mnemopi
security:
  enabled: true
plan:
  defaultOnStartup: true
modelRoles:
  default: openai-codex/gpt-5.6-sol
  plan: openai-codex/gpt-5.6-sol:medium
  commit: opencode-go/deepseek-v4.1-flash:low
  task: opencode-go/deepseek-v4.1-flash:medium
  advisor: openai-codex/gpt-5.6-luna:low
  vision: openai-codex/gpt-5.6-sol:medium
  slow: openai-codex/gpt-6-astra:high
  smol: opencode-go/deepseek-v4.1-flash:low
  review: openai-codex/gpt-5.6-sol:medium
  tiny: opencode-go/deepseek-v4.1-flash:low
treeFilterMode: all
github:
  enabled: true
vault:
  enabled: false
computer:
  enabled: true
astGrep:
  enabled: true
dev:
  autoqaConsent: granted
hideThinkingBlock: true
omitThinking: false
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: immediate
tools:
  approvalMode: yolo
error:
  notify: 'on'
features:
  unexpectedStopDetection: smart
contextPromotion:
  enabled: true
branchSummary:
  enabled: true
autolearn:
  enabled: false
  autoContinue: true
edit:
  mode: hashline
eval:
  jl: true
  rb: true
checkpoint:
  enabled: true
task:
  enableLsp: true
  eager: default
  enableEffort: false
  isolation:
    enabled: false
  batch: true
  maxConcurrency: 2
  maxRecursionDepth: 1
  softRequestBudget: 15
  softRequestBudgetNotice: true
  maxRuntimeMs: 600000
  prewalk: false
  showResolvedModelBadge: true
  agentModelOverrides:
    scout: '@smol'
    sonic: '@smol'
    task: '@task'
    tester: '@task'
    reviewer: '@review'
    security-reviewer: '@review'
    omp-configurator: '@review'
  agentAdvisor:
    scout: 'off'
    sonic: 'off'
    task: 'off'
    tester: 'off'
    reviewer: 'off'
    security-reviewer: 'off'
    omp-configurator: 'off'
  agentPrewalk:
    scout: 'off'
    sonic: 'off'
    task: 'off'
    tester: 'off'
    reviewer: 'off'
    security-reviewer: 'off'
    omp-configurator: 'off'
composer:
  shape: field
retry:
  fallbackChains:
    opencode-go/gpt-5.6-luna:
    - opencode-go/muse-spark-1.3-contributor
    openai-codex/gpt-6-astra:
    - opencode-go/kimi-k3:high
    openai-codex/gpt-5.6-sol:
    - opencode-go/glm-5.3-flash:high
    openai-codex/gpt-5.6-luna:
    - opencode-go/glm-5.3-flash:low
    - opencode-go/deepseek-v4.1-flash:high
    openai-codex/*:
    - opencode-go/glm-5.3-flash:high
  modelFallback: true
  maxRetries: 1
  fallbackRevertPolicy: cooldown-expiry
browser:
  headless: true
collab:
  webUrl: ''
compaction:
  enabled: true
tui:
  textSizing: false
  tight: false
display:
  showTokenUsage: true
  showTurnTime: true
startup:
  changelogMode: hidden
  quiet: true
advisor:
  enabled: false
  syncBacklog: 'off'
  immuneTurns: 3
  maxNotesPerUpdate: 1
symbolPreset: unicode
