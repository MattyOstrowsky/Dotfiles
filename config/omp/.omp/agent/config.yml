providers:
  webSearchOrder:
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
setupVersion: 2
theme:
  dark: dark-catppuccin
  light: dark-nord
colorBlindMode: true
statusLine:
  transparent: true
  compactThinkingLevel: false
  showHookStatus: true
  preset: default
defaultThinkingLevel: auto
memory:
  backend: local
security:
  enabled: true
plan:
  defaultOnStartup: true
modelRoles:
  default: opencode-go/gpt-5.6-luna:max
  plan: opencode-go/kimi-k3:max
  commit: opencode-go/gpt-5.6-luna:auto
  task: opencode-go/deepseek-v4-flash:auto
  advisor: opencode-go/kimi-k3:auto
  vision: opencode-go/gpt-5.6-luna
treeFilterMode: all
github:
  enabled: true
vault:
  enabled: false
computer:
  enabled: true
astGrep:
  enabled: true
dev:
  autoqaConsent: granted
hideThinkingBlock: true
omitThinking: false
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: immediate
tools:
  approvalMode: yolo
error:
  notify: "on"
features:
  unexpectedStopDetection: smart
contextPromotion:
  enabled: true
branchSummary:
  enabled: true
autolearn:
  enabled: true
  autoContinue: true
edit:
  mode: hashline
eval:
  jl: true
  rb: true
checkpoint:
  enabled: true
task:
  enableLsp: true
  eager: preferred
  enableEffort: false
  isolation:
    enabled: false
composer:
  shape: field
retry:
  fallbackChains:
    opencode-go/gpt-5.6-luna:
      - opencode-go/muse-spark-1.3-contributor
browser:
  headless: true
collab:
  webUrl: ""
compaction:
  enabled: true
tui:
  textSizing: false
  tight: false
display:
  showTokenUsage: true
  showTurnTime: true
startup:
  changelogMode: hidden